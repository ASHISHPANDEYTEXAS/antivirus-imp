<!DOCTYPE html>
<html>
<head>
    <title>SkyHigh Air & Hotels</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
    body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        padding: 10px; 
        margin: 0;
        /* Changed from height to min-height to allow scrolling on mobile */
        min-height: 100vh; 
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(100, 121, 144, 0.4)), 
                          url('airport6.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
    }

    .container { 
        background: rgba(134, 96, 131, 0.92); 
        padding: 25px; 
        border-radius: 15px; 
        max-width: 450px; 
        width: 92%; /* Gives breathing room on mobile edges */
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(5px);
        margin: 20px auto; /* Centers container and adds vertical spacing */
        box-sizing: border-box;
    }

    h2 {
        color: #003580;
        text-align: center;
        margin-top: 0;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 1.5rem;
    }

    h3 {
        color: #fff; /* Changed to white for better visibility on purple */
        border-bottom: 2px solid #007bff;
        padding-bottom: 10px;
        margin-bottom: 20px;
    }

    input { 
        width: 100%; 
        padding: 12px; 
        margin: 8px 0; /* Slightly tighter margins for mobile */
        box-sizing: border-box; 
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 16px; /* Prevents iOS auto-zoom on focus */
    }

    button { 
        width: 100%; 
        padding: 14px; 
        background: #007bff; 
        color: white; 
        border: none; 
        border-radius: 8px;
        cursor: pointer; 
        font-size: 18px;
        font-weight: 600;
        transition: all 0.3s ease;
        margin-top: 10px;
    }

    button:hover {
        background: #0056b3;
        transform: translateY(-2px);
    }

    #results {
        margin-top: 20px;
        max-height: 250px;
        overflow-y: auto;
        /* Smooth scrolling for mobile */
        -webkit-overflow-scrolling: touch;
    }

    footer {
        width: 100%;
        max-width: 800px;
        margin-top: auto; 
        padding: 20px;
        box-sizing: border-box;
    }

    .hidden { display: none; }

    /* Mobile-Specific Adjustments */
    @media (max-width: 480px) {
        .container {
            padding: 20px;
        }
        h2 {
            font-size: 1.2rem;
        }
        button {
            font-size: 16px;
            padding: 12px;
        }
    }

    /* Animation for Smooth Entry */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.container:not(.hidden) {
    animation: fadeIn 0.6s ease-out;
}

/* Luxury Logout Button */
.logout-btn {
    width: auto !important;
    background: rgba(255, 255, 255, 0.15) !important;
    border: 1px solid rgba(255, 255, 255, 0.3) !important;
    padding: 8px 15px !important;
    font-size: 13px !important;
    backdrop-filter: blur(5px);
}

.logout-btn:hover {
    background: #dc3545 !important;
    border-color: #dc3545 !important;
}

/* Loading Spinner */
.spinner {
    border: 4px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    border-top: 4px solid #fff;
    width: 30px;
    height: 30px;
    animation: spin 1s linear infinite;
    margin: 0 auto;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

    </style>
    
</head>
<body>

<div class="container" id="auth-box">
    <h2 id="form-title">Sign Up</h2>
    <input type="text" id="name" placeholder="Full Name">
    <input type="text" id="pass_mobile" placeholder="Passenger Mobile Number">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <input type="number" id="age" placeholder="Age">
    <input type="text" id="par_mobile" placeholder="Parent Mobile Number">
    <input type="text" id="country" placeholder="Country">
    <input type="text" id="state" placeholder="State">
    <input type="text" id="district" placeholder="District">

    <button onclick="submitAuth()" id="btn-text">Register</button>
    <p onclick="toggleAuth()" style="text-align:center; cursor:pointer; color: blue;">Already have an account? Login</p>
</div>

<!-- Updated Dashboard Container -->
<div class="container hidden" id="dashboard">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <div style="text-align: left;">
            <p style="color: #e0e0e0; margin: 0; font-size: 14px;">Welcome back,</p>
            <h2 id="user-name" style="color: #fff; margin: 0; text-align: left; font-size: 1.4rem;"></h2>
        </div>
        <button onclick="handleLogout()" class="logout-btn">
            Logout
        </button>
    </div>

    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <button onclick="showProfile()" style="flex: 1; background: #28a745; font-size: 14px; padding: 10px;">Profile</button>
        <button onclick="showSearch()" style="flex: 1; background: #007bff; font-size: 14px; padding: 10px;">Search</button>
    </div>

    <!-- Loading Overlay for transitions -->
    <div id="loader" class="hidden" style="text-align: center; padding: 20px;">
        <div class="spinner"></div>
        <p style="color: white; margin-top: 10px;">Securing your session...</p>
    </div>

    <!-- Hidden Profile Section -->
    <div id="profile-section" class="hidden" style="color: white; animation: fadeIn 0.5s;">
        <hr style="opacity: 0.3;">
        <h3>Account Details</h3>
        <p><strong>Age:</strong> <span id="p-age"></span></p>
        <p><strong>Mobile:</strong> <span id="p-mobile"></span></p>
        <p><strong>Address:</strong> <span id="p-address"></span></p>
    </div>   

    <!-- Search Section -->
    <div id="booking-section">
        <h3 style="color: #fff;">Search & Book Flights</h3>
        <input type="text" id="origin" placeholder="From (e.g. New York)">
        <input type="text" id="destination" placeholder="To (e.g. London)">
        <button onclick="findTrip()">Search Flights</button>
        <div id="results"></div>
    </div>
</div>
 
<script src="app.js"></script>

<!-- Footer with Mandatory Policy Links -->
<footer style="margin-top: 50px; padding: 20px; background: rgba(0, 0, 0, 0.7); color: white; text-align: center; border-radius: 10px;">
    <p>&copy; 2026 JetSwiftFly. All rights reserved.</p>
    <div style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;">
        <a href="contact.html" style="color: #007bff; text-decoration: none;">Contact Us</a>
        <a href="terms.html" style="color: #007bff; text-decoration: none;">Terms & Conditions</a>
        <a href="privacy.html" style="color: #007bff; text-decoration: none;">Privacy Policy</a>
        <a href="refund.html" style="color: #007bff; text-decoration: none;">Refund & Cancellation</a>
    </div>
</footer>

</body>
</html>
