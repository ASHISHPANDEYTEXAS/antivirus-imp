<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JetSwift | AI-Powered Travel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Payment & PDF Libraries -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --primary-glow: #00d2ff;
            --secondary-glow: #3a7bd5;
            --glass-bg: rgba(15, 20, 30, 0.8);
            --text-main: #ffffff;
            --text-dim: #b0b8c4;
            --danger: #ff4b5c;
            --nav-height: 80px;
        }

        body { 
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif; 
            padding: 0; margin: 0;
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            background: #0f172a; 
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 210, 255, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(58, 123, 213, 0.1) 0%, transparent 40%),
                url('airport6.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* --- AUTHENTICATION BOX (Centered) --- */
        #auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card { 
            background: var(--glass-bg); 
            padding: 40px; 
            border-radius: 24px; 
            max-width: 450px; 
            width: 100%; 
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.8s ease-out;
        }

        /* --- FULL SCREEN DASHBOARD LAYOUT --- */
        #dashboard {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.5s ease-in;
        }

        header {
            height: var(--nav-height);
            background: rgba(10, 15, 25, 0.7);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .main-content {
            flex: 1;
            padding: 40px 5%;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        /* --- UI COMPONENTS --- */
        .glass-panel {
            background: var(--glass-bg);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            margin-bottom: 30px;
        }

        h2 { 
            font-weight: 700; 
            background: linear-gradient(to right, #fff, #a5b4fc); 
            background-clip: text; 
            -webkit-text-fill-color: transparent; 
            margin-bottom: 25px;
        }
        
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; }

        input { 
            width: 100%; padding: 14px 16px; 
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 12px;
            font-size: 16px; color: #fff;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus { border-color: var(--primary-glow); outline: none; background: rgba(255, 255, 255, 0.1); }

        button { 
            padding: 16px 24px; 
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            color: white; border: none; border-radius: 12px;
            cursor: pointer; font-size: 16px; font-weight: 700;
            transition: 0.4s;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.2);
        }

        button:hover { transform: translateY(-2px); filter: brightness(1.1); box-shadow: 0 8px 25px rgba(0, 210, 255, 0.4); }

        .logo { font-size: 26px; font-weight: 900; letter-spacing: 2px; color: #fff; }
        .logo span { color: var(--primary-glow); }

        .profile-trigger {
            background: rgba(255, 255, 255, 0.07);
            padding: 10px 20px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer; position: relative;
        }

        .dropdown-menu {
            position: absolute; right: 0; top: 60px;
            background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; width: 200px; display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .dropdown-menu.show { display: block; }
        .dropdown-item { padding: 12px 20px; color: var(--text-dim); cursor: pointer; }
        .dropdown-item:hover { background: rgba(255,255,255,0.05); color: #fff; }

        /* --- SEARCH GRID --- */
        .search-grid {
            display: grid;
            grid-template-columns: 2fr 2fr 1fr;
            gap: 20px;
            align-items: end;
        }

        .hidden { display: none !important; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        footer {
            padding: 30px; background: rgba(10, 15, 25, 0.8);
            text-align: center; color: var(--text-dim); font-size: 13px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        footer a { color: #fff; text-decoration: none; margin: 0 10px; }

        /* Booking Modal */
        #booking-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            z-index: 2000; display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

<!-- 1. AUTHENTICATION SECTION (Visible by Default) -->
<div id="auth-container">
    <div class="auth-card" id="auth-box">
        <h2 id="form-title">Neural Login</h2>
        
        <div class="input-group hidden" id="name-group">
            <label>Full Identity</label>
            <input type="text" id="name" placeholder="Enter Full Name">
        </div>

        <div class="input-group">
            <label>Node Address</label>
            <input type="email" id="email" placeholder="Email Address">
        </div>

        <div class="input-group">
            <label>Access Key</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button onclick="submitAuth()" style="width: 100%;" id="btn-text">Authenticate</button>
        
        <p id="toggle-text" style="margin-top: 25px; font-size: 14px; color: var(--text-dim);">
            New user? <span onclick="toggleAuth()" style="color: var(--primary-glow); cursor: pointer; font-weight: 600;">Initialize Account</span>
        </p>
    </div>
</div>

<!-- 2. FULL SCREEN DASHBOARD (Hidden until login) -->
<div id="dashboard" class="hidden">
    <header>
        <div class="logo">JET<span>SWIFT</span></div>
        <div style="position: relative;">
            <div class="profile-trigger" onclick="toggleDropdown()">
                <span id="user-display-name">Pilot</span> ▾
            </div>
            <div class="dropdown-menu" id="profile-dropdown">
                <div class="dropdown-item" onclick="showProfile()">Protocol: Profile</div>
                <div class="dropdown-item" onclick="showSearch()">Protocol: Search</div>
                <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.05);">
                <div class="dropdown-item" onclick="handleLogout()" style="color: var(--danger);">Terminate Session</div>
            </div>
        </div>
    </header>

    <div class="main-content">
        <!-- Profile View -->
        <div id="profile-section" class="glass-panel hidden">
            <h2 style="color: var(--primary-glow);">Identity Overview</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div><label>Active Identity</label><p id="p-name-display" style="font-size: 18px;"></p></div>
                <div><label>Secure Registry</label><p id="p-email-display" style="font-size: 18px;"></p></div>
            </div>
            <button onclick="showSearch()" style="margin-top: 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);">Return to Terminal</button>
        </div>

        <!-- Search View -->
        <div id="booking-section">
            <div class="glass-panel">
                <h2>Flight Trajectory Scanner</h2>
                <div class="search-grid">
                    <div class="input-group" style="margin:0;">
                        <label>Origin Node</label>
                        <input type="text" id="origin" placeholder="e.g. Bengaluru">
                    </div>
                    <div class="input-group" style="margin:0;">
                        <label>Destination Node</label>
                        <input type="text" id="destination" placeholder="e.g. Delhi">
                    </div>
                    <button onclick="findTrip()">Scan Now</button>
                </div>
            </div>
            
            <div id="results">
                <!-- Flight cards will appear here -->
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 JetSwift AI Trajectories. All systems operational.</p>
        <div>
            <a href="terms.html">Terms</a> | <a href="privacy.html">Privacy</a> | <a href="contact.html">Support</a>
        </div>
    </footer>
</div>

<!-- 3. PASSENGER MODAL -->
<div id="booking-modal" class="hidden">
    <div class="auth-card" style="max-width: 400px;">
        <h2>Passenger Data</h2>
        <div class="input-group"><label>Age</label><input type="number" id="book-age"></div>
        <div class="input-group"><label>Comms Number</label><input type="text" id="book-mobile"></div>
        <div class="input-group"><label>Location Registry</label><input type="text" id="book-address"></div>
        <button onclick="confirmAndPay()" style="width: 100%;">Finalize & Execute</button>
        <button onclick="closeModal()" style="background: transparent; color: var(--text-dim); margin-top: 10px; width: 100%;">Abort</button>
    </div>
</div>

<!-- SCRIPTS -->
<script src="app.js"></script>
<script>
    let isLogin = true;

    function toggleAuth() {
        isLogin = !isLogin;
        document.getElementById('form-title').innerText = isLogin ? "Neural Login" : "Initialize Account";
        document.getElementById('btn-text').innerText = isLogin ? "Authenticate" : "Initialize";
        document.getElementById('name-group').classList.toggle('hidden', isLogin);
        document.getElementById('toggle-text').innerHTML = isLogin ? 
            "New user? <span onclick='toggleAuth()' style='color: var(--primary-glow); cursor: pointer;'>Initialize Account</span>" : 
            "Existing pilot? <span onclick='toggleAuth()' style='color: var(--primary-glow); cursor: pointer;'>Login Access</span>";
    }

    function toggleDropdown() {
        document.getElementById('profile-dropdown').classList.toggle('show');
    }

    // Close dropdown when clicking outside
    window.onclick = function(event) {
        if (!event.target.matches('.profile-trigger')) {
            const dropdowns = document.getElementsByClassName("dropdown-menu");
            for (let i = 0; i < dropdowns.length; i++) {
                if (dropdowns[i].classList.contains('show')) dropdowns[i].classList.remove('show');
            }
        }
    }

    /* 
       Note for app.js: 
       When login is successful, you must call:
       document.getElementById('auth-container').classList.add('hidden');
       document.getElementById('dashboard').classList.remove('hidden');
    */
</script>

</body>
</html>
